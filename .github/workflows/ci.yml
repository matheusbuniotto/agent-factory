name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  proofs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proofs
    steps:
      - uses: actions/checkout@v5
      - run: curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
      - run: ~/.elan/bin/lean Factory.lean   # the version comes from lean-toolchain

  evals:
    # Real models, so only on main or by hand, and only when a key is configured.
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v5
        if: env.ANTHROPIC_API_KEY != ''
      - uses: astral-sh/setup-uv@v6
        if: env.ANTHROPIC_API_KEY != ''
      - run: uv sync --frozen && uv run python evals/run.py
        if: env.ANTHROPIC_API_KEY != ''
      - uses: actions/upload-artifact@v4
        if: always() && env.ANTHROPIC_API_KEY != ''
        with:
          name: evals-report
          path: evals/report.json
