[project]
name = "agent-factory"
version = "0.1.0"
description = "An autonomous coding factory: task in, reviewed pull request out."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "claude-agent-sdk>=0.2.159",
    "pydantic>=2.13",
    "pydantic-ai-harness[anthropic]>=0.34",
    "pydantic-ai-slim[openai]",
    "typer>=0.16",
]

[project.optional-dependencies]
logfire = ["logfire>=4"]

[project.scripts]
factory = "factory.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12", "pre-commit>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["factory"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
